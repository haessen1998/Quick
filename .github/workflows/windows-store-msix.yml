name: Windows Store MSIX

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: quick-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build Microsoft Store package
    runs-on: windows-latest
    env:
      WAILS_VERSION: v3.0.0-beta.14
      WAILS_MCP: "1"
      QUICK_MCP_HOST: "127.0.0.1"
      QUICK_MCP_PORT: "43122"
      # Public package identity assigned to QuickDev (Store ID 9P084NQXKDMQ).
      STORE_IDENTITY_NAME: haessen.QuickDev
      STORE_PUBLISHER: CN=248AC9D1-95E3-40D3-B8EF-1D38B72432B7

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve and validate package version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path "build/config.yml" -Pattern '^\s*version:\s*"(?<version>[^\"]+)"' | Select-Object -First 1
          if (-not $match) {
            throw "Unable to read info.version from build/config.yml"
          }

          $configVersion = $match.Matches[0].Groups["version"].Value
          if ("${{ github.ref_type }}" -eq "tag") {
            $tagVersion = "${{ github.ref_name }}".TrimStart("v")
            if ($tagVersion -ne $configVersion) {
              throw "Tag version $tagVersion does not match build/config.yml version $configVersion"
            }
          }

          $versionInfoPath = "build/windows/info.json"
          $versionInfo = Get-Content -Raw $versionInfoPath | ConvertFrom-Json
          $versionInfo.fixed.file_version = $configVersion
          foreach ($translation in $versionInfo.info.PSObject.Properties) {
            $translation.Value | Add-Member -NotePropertyName FileVersion -NotePropertyValue $configVersion -Force
            $translation.Value | Add-Member -NotePropertyName ProductVersion -NotePropertyValue $configVersion -Force
          }
          $versionInfo | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 $versionInfoPath

          "version=$configVersion" >> $env:GITHUB_OUTPUT
          "exe_artifact=Quick-$configVersion-windows-x64.exe" >> $env:GITHUB_OUTPUT
          "msix_artifact=Quick-$configVersion-windows-x64-store.msix" >> $env:GITHUB_OUTPUT
          "VITE_APP_VERSION=v$configVersion" >> $env:GITHUB_ENV

      - name: Install Wails
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@$env:WAILS_VERSION
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install Wails $env:WAILS_VERSION"
          }

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Test and build frontend
        run: npm run build --prefix frontend

      - name: Test Go code
        run: go test -tags mcp ./...

      - name: Build Windows executable
        run: wails3 build GOOS=windows

      - name: Prepare versioned executable
        shell: pwsh
        run: Copy-Item -LiteralPath "bin\quick.exe" -Destination "bin\${{ steps.version.outputs.exe_artifact }}"

      - name: Build unsigned Store MSIX
        shell: pwsh
        run: |
          .\build\windows\msix\package.ps1 `
            -ExecutablePath "bin\quick.exe" `
            -OutputPath "bin\${{ steps.version.outputs.msix_artifact }}" `
            -IdentityName $env:STORE_IDENTITY_NAME `
            -Publisher $env:STORE_PUBLISHER `
            -Version "${{ steps.version.outputs.version }}"

      - name: Create checksum
        shell: pwsh
        run: |
          $artifacts = @(
            "${{ steps.version.outputs.exe_artifact }}",
            "${{ steps.version.outputs.msix_artifact }}"
          )
          foreach ($name in $artifacts) {
            $artifact = Join-Path "bin" $name
            $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content -NoNewline "$artifact.sha256"
          }

      - name: Upload Store submission artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quick-${{ steps.version.outputs.version }}-windows-store
          path: |
            bin/${{ steps.version.outputs.exe_artifact }}
            bin/${{ steps.version.outputs.exe_artifact }}.sha256
            bin/${{ steps.version.outputs.msix_artifact }}
            bin/${{ steps.version.outputs.msix_artifact }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(
            "bin\${{ steps.version.outputs.exe_artifact }}",
            "bin\${{ steps.version.outputs.exe_artifact }}.sha256",
            "bin\${{ steps.version.outputs.msix_artifact }}",
            "bin\${{ steps.version.outputs.msix_artifact }}.sha256"
          )
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" $files --clobber
          } else {
            $releaseArgs = @(
              "${{ github.ref_name }}"
              $files
              "--verify-tag"
              "--generate-notes"
              "--title"
              "Quick ${{ github.ref_name }}"
            )
            $notesPath = ".github\release-notes\${{ github.ref_name }}.md"
            if (Test-Path -LiteralPath $notesPath) {
              $releaseArgs += @("--notes", (Get-Content -Raw -LiteralPath $notesPath))
            }
            gh release create @releaseArgs
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub Release ${{ github.ref_name }}"
            }
          }
